<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<script src="js/theme.js"></script>
<title>Fun Colors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/quiz.css">
<link rel="stylesheet" href="css/colors.css">
<link rel="stylesheet" href="css/paint.css">
</head>
<body data-topic="colors">
<div class="wrap">
  <header class="bar">
    <a class="icon-btn" href="index.html" aria-label="Back to games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></a>
    <h1>Fun <span>Colors</span></h1>
    <button class="icon-btn" data-theme-toggle aria-label="Switch to dark mode"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="icon-btn" id="fsBtn" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    <button class="icon-btn" id="setBtn" aria-label="Grown-up settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg></button>
  </header>

  <nav class="chips" aria-label="Ways to play">
    <button class="chip" data-mode="learn" aria-pressed="true"><span class="e" aria-hidden="true">🎨</span>Paint</button>
    <button class="chip" data-mode="game" aria-pressed="false"><span class="e" aria-hidden="true">🎈</span>Pop</button>
    <button class="chip" data-mode="quiz" aria-pressed="false"><span class="e" aria-hidden="true">🎯</span>Quiz</button>
  </nav>

  <div id="mode-learn">
    <section class="studio" aria-label="Paint studio">
      <div class="canvas-wrap">
        <canvas id="paintCanvas" aria-label="Painting canvas. Draw with your finger."></canvas>
        <div class="paint-hint" id="paintHint">Pick a color, then paint with your finger!</div>
      </div>
      <div class="pots" id="pots" role="group" aria-label="Paint colors"></div>
      <div class="tools-row">
        <button class="size" data-size="12" aria-label="Thin brush" aria-pressed="false"><i style="width:10px;height:10px"></i></button>
        <button class="size" data-size="26" aria-label="Medium brush" aria-pressed="true"><i style="width:20px;height:20px"></i></button>
        <button class="size" data-size="46" aria-label="Thick brush" aria-pressed="false"><i style="width:32px;height:32px"></i></button>
        <button class="btn quiet" id="clearBtn">🧽 Clear</button>
      </div>
      <p class="hint">Tap a paint pot to hear the color. Then paint!</p>
    </section>
  </div>

  <div id="mode-game" hidden>
    <section aria-label="Balloon game" style="display:flex;flex-direction:column;gap:14px">
      <div class="hud">
        <span class="goal"><span class="gsw" id="gsw"></span><span id="gtext">Pop the red balloons!</span></span>
        <span class="pips" id="pips" aria-hidden="true"></span>
        <span class="stat-pill" aria-label="Stars"><span aria-hidden="true">⭐</span><span id="pstars">0</span></span>
      </div>
      <div class="sky" id="sky" aria-label="Balloons floating up"></div>
      <p class="msg" id="pmsg" aria-live="polite"></p>
    </section>
  </div>

<div id="mode-quiz" hidden>
    <section class="quiz" aria-label="Game">
      <div class="score">
        <span class="stat-pill" aria-label="Stars"><span aria-hidden="true">⭐</span><span id="stars">0</span></span>
        <span class="stat-pill" aria-label="In a row"><span aria-hidden="true">🔥</span><span id="streak">0</span></span>
      </div>
      <button class="prompt chunky" id="prompt"></button>
      <div class="choices" id="choices"></div>
      <p class="msg" id="msg" aria-live="polite"></p>
    </section>
  </div>

</div>

<dialog class="sheet" id="settings" aria-labelledby="setTitle">
  <div class="sheet-in">
    <h2 id="setTitle">Grown-ups</h2>
    <p class="note">Saved on this device for every game.</p>
        <label class="opt">Say names out loud <input type="checkbox" id="optVoice" data-setting="voice"></label>
        <label class="opt">Play sounds <input type="checkbox" id="optSfx" data-setting="sfx"></label>
    <div class="opt">Answers to pick from
      <div class="seg" role="radiogroup" aria-label="Answers to pick from">
        <label><input type="radio" name="choices" value="3" data-setting="choices"><span>3</span></label>
        <label><input type="radio" name="choices" value="4" data-setting="choices"><span>4</span></label>
      </div>
    </div>
    <div class="opt">Look
      <div class="seg" role="radiogroup" aria-label="Look">
        <label><input type="radio" name="theme" value="system" data-setting="theme"><span>Auto</span></label>
        <label><input type="radio" name="theme" value="light" data-setting="theme"><span>Light</span></label>
        <label><input type="radio" name="theme" value="dark" data-setting="theme"><span>Dark</span></label>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn quiet" id="resetBtn">Clear stars and stickers</button>
      <button class="btn" data-close>Done</button>
    </div>
  </div>
</dialog>

<script src="js/core.js"></script>
<script src="js/timer.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/paint.js"></script>
<script src="js/topic.js"></script>
</body>
</html>

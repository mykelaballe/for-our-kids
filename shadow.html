<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<script src="js/theme.js"></script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Shadow Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shadow.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="icon-btn" href="index.html" aria-label="Back to games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></a>
    <h1>Shadow <span>Match</span></h1>
    <button class="icon-btn" data-theme-toggle aria-label="Switch to dark mode"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="icon-btn" id="fsBtn" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    <button class="icon-btn" id="setBtn" aria-label="Grown-up settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg></button>
  </header>

  <nav class="chips" aria-label="Pictures">
    <button class="chip" data-theme-pick="animals" aria-pressed="true"><span class="e" aria-hidden="true">🐮</span>Animals</button>
    <button class="chip" data-theme-pick="shapes" aria-pressed="false"><span class="e" aria-hidden="true">🔺</span>Shapes</button>
    <button class="chip" data-theme-pick="letters" aria-pressed="false"><span class="e" aria-hidden="true">🍎</span>Letters</button>
  </nav>
  <nav class="chips" aria-label="Level">
    <button class="chip" data-level-pick="easy" aria-pressed="true">Easy <small>2</small></button>
    <button class="chip" data-level-pick="medium" aria-pressed="false">Medium <small>3</small></button>
    <button class="chip" data-level-pick="hard" aria-pressed="false">Hard <small>4</small></button>
  </nav>

  <section class="play" aria-label="Shadow match game">
    <div class="score">
      <span class="stat-pill" aria-label="Matched"><span aria-hidden="true">🧩</span><span id="found">0 / 2</span></span>
      <span class="stat-pill" aria-label="Games won"><span aria-hidden="true">🏆</span><span id="wins">0</span></span>
    </div>
    <div class="tray shadows" id="shadows" aria-label="Shadows"></div>
    <div class="tray pieces" id="pieces" aria-label="Pictures"></div>
    <p class="hint" id="hint"></p>
    <div class="result" id="result" hidden>
      <p class="result-text" id="resultText"></p>
      <button class="btn" id="againBtn">Play again</button>
    </div>
    <button class="btn quiet" id="newBtn">New game</button>
  </section>
</div>

<dialog class="sheet" id="settings" aria-labelledby="setTitle">
  <div class="sheet-in">
    <h2 id="setTitle">Grown-ups</h2>
    <p class="note">Saved on this device for every game.</p>
    <label class="opt">Say names out loud <input type="checkbox" id="optVoice" data-setting="voice"></label>
    <label class="opt">Play sounds <input type="checkbox" id="optSfx" data-setting="sfx"></label>
    <div class="opt">Look
      <div class="seg" role="radiogroup" aria-label="Look">
        <label><input type="radio" name="theme" value="system" data-setting="theme"><span>Auto</span></label>
        <label><input type="radio" name="theme" value="light" data-setting="theme"><span>Light</span></label>
        <label><input type="radio" name="theme" value="dark" data-setting="theme"><span>Dark</span></label>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn quiet" id="resetBtn">Clear matches won</button>
      <button class="btn" data-close>Done</button>
    </div>
  </div>
</dialog>

<script src="js/core.js"></script>
<script src="js/timer.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/shadow.js"></script>
</body>
</html>
